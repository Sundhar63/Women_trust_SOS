version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: nayeam_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: nayeam_database
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: nayeam_api
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DB_CONNECTION_STRING=postgresql://admin:mysecretpassword@db:5432/nayeam_database

volumes:
  postgres_data:
